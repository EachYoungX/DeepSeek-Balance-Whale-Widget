name: Pixel GitHub Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and review artifacts without publishing a Release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pixel-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check release branch
        run: |
          case "$GITHUB_REF" in
            refs/heads/pixel-animation|refs/heads/main) ;;
            *) echo 'Choose pixel-animation or main for a pixel release'; exit 1 ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Validate code, resources and behavior
        run: npm run check

      - name: Syntax, layers and development paths
        run: |
          node --check lib/index.js
          node --check assets/whale-widget.js
          node tools/z-layer-audit.mjs assets/whale-widget.js
          if grep -n 'TestBox' lib/index.js lib/accounting.mjs assets/whale-widget.js; then
            echo 'Remove development paths before releasing'; exit 1
          fi

      - name: Audit installable package
        run: node tools/ci-audit.mjs

      - name: Build versioned archives and checksums
        run: npm run release:bundle

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-release
          path: .test-output/release/*/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'This Release already exists; choose a new version'; exit 1
          fi
          printf '%s\n' \
            "DSH whale pixel animation ${VERSION}." \
            '' \
            'Install or replace dsh-whale-widget through the official DSH plugin manager.' \
            'Keep existing widget data. For an installed package, remove the bundle before installing this version.' \
            '' \
            "Installation: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/INSTALL.md" \
            "Sources and attribution: https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/NOTICE.md" \
            > .test-output/release-notes.md
          gh release create "$TAG" .test-output/release/"$VERSION"/* \
            --target "$GITHUB_SHA" \
            --title "Whale Pixel ${VERSION}" \
            --prerelease \
            --notes-file .test-output/release-notes.md

      - name: Summary
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            echo 'Archives validated. Download the pixel-release artifact to review; no Release was published.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'GitHub Release published with archives and SHA256SUMS.txt.' >> "$GITHUB_STEP_SUMMARY"
          fi
